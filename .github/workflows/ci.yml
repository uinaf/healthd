name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Concurrency is scoped to this job so superseded PR pushes cancel their
    # own verify runs WITHOUT cancelling an in-flight `release` job that may
    # already have created a tag/GitHub Release.
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: verify (fmt + lint + test + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Go version from .tool-versions
        id: go-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "golang" { print $2; exit }' .tool-versions)
          if [ -z "${version}" ]; then
            echo "Failed to determine Go version from .tool-versions" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Run verifier (fmt + lint + test + coverage gate)
        run: go run ./cmd/verify

  # Tag, release notes, GitHub Release, binaries, and Homebrew tap update
  # all happen here on push to `main` after `verify` passes. Conventional
  # Commits drive the version. No manual `scripts/release.sh` step.
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      deployment: false
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            healthd
            homebrew-tap
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # GitHub links bot commits when the noreply email uses `{user-id}+{slug}[bot]@…`.
      - name: Resolve release bot identity
        id: release-bot-identity
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          APP_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Read Go version from .tool-versions
        id: go-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "golang" { print $2; exit }' .tool-versions)
          if [ -z "${version}" ]; then
            echo "Failed to determine Go version from .tool-versions" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false
          cache-dependency-path: |
            **/go.sum

      # Decides the next version from Conventional Commits and creates the tag
      # plus a mutable draft release. The workflow publishes that draft only
      # after GoReleaser and provenance verification finish successfully.
      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@7.0.2
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com

      # semantic-release creates the tag via the GitHub Release API; pull all
      # tags so we can detect one at HEAD (whether just-created or already
      # present from a previous partial-failure run).
      - name: Fetch tags
        run: git fetch --tags --force

      # Gate GoReleaser on "is there a tag at HEAD?" rather than
      # `steps.release.outputs.new_release_published`. Re-running the job
      # after a partial failure (semantic-release succeeded, GoReleaser
      # failed mid-flight) still resumes the existing mutable draft because
      # the tag is now there. A later state check skips mutation entirely once
      # that release has already been published.
      - name: Detect tag at HEAD
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "found tag at HEAD: ${tag}"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no tag at HEAD — skipping GoReleaser"
          fi

      - name: Inspect GitHub Release state
        if: steps.tag.outputs.present == 'true'
        id: release-state
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          echo "published=$([[ "$is_draft" == "false" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Check out Homebrew tap
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uinaf/homebrew-tap
          token: ${{ steps.release-bot.outputs.token }}
          path: homebrew-tap
          ref: main
          persist-credentials: false

      - name: Stage Homebrew formula
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cp dist/homebrew/Formula/healthd.rb homebrew-tap/Formula/healthd.rb
          grep -F "$RELEASE_TAG" homebrew-tap/Formula/healthd.rb
          git -C homebrew-tap diff --check

      - name: Commit Homebrew formula
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "healthd ${{ steps.tag.outputs.tag }}"
          repo: uinaf/homebrew-tap
          branch: main
          file_pattern: Formula/healthd.rb
          repository: homebrew-tap
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}

      - name: Verify draft artifacts
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c checksums.txt)
          asset_count="$(
            gh release view "$RELEASE_TAG" --json assets \
              --jq '[.assets[].name | select(test("^(healthd_v[0-9]+\\.[0-9]+\\.[0-9]+_darwin_(arm64|amd64)\\.tar\\.gz|checksums\\.txt)$"))] | length'
          )"
          if [[ "$asset_count" != "3" ]]; then
            echo "expected two darwin archives and checksums.txt, found $asset_count matching assets" >&2
            exit 1
          fi

      - name: Attest build provenance
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/healthd_*.tar.gz"

      - name: Publish verified draft
        if: steps.tag.outputs.present == 'true' && steps.release-state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify immutable release
        if: steps.tag.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG"; then
              exit 0
            fi
            if (( attempt == 12 )); then
              exit 1
            fi
            sleep 5
          done
